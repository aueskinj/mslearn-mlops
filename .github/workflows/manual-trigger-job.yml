name: Manually trigger an Azure Machine Learning job

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Run Azure Machine Learning training job
      env:
        RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        WS: ${{ vars.AZURE_WORKSPACE_NAME }}
      run: |
        JOB_NAME=$(az ml job create -f src/job.yml --query name -o tsv -g "$RG" -w "$WS")
        echo "Submitted job: $JOB_NAME"
        while true; do
          STATUS=$(az ml job show -n "$JOB_NAME" --query status -o tsv -g "$RG" -w "$WS")
          echo "Status: $STATUS"
          case "$STATUS" in
            Completed) exit 0 ;;
            Failed|Canceled|NotResponding) exit 1 ;;
          esac
          sleep 20
        done